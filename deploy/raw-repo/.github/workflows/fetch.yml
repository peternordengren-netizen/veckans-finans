# Mall för det PRIVATA repot veckans-finans-raw. Kopieras dit som
# .github/workflows/fetch.yml – ligger här under deploy/ så att den aldrig
# körs i det publika repot.
#
# Hämtar råtext varannan timme med scripts/fetch.py från det publika repot
# och committar resultatet till det privata repot. Rådatan når aldrig det
# publika repot.
name: Hämta råtext

on:
  schedule:
    # Varannan timme, dygnet runt (UTC). Minut 17 för att undvika rusningen vid hel timme i GitHub Actions.
    # MFN:s RSS bara var fjärde timme (MFN:s robots.txt spärrar "*.rss$"; tills vidare glesare, se fetch.py):
    # körningarna från det första schemat hämtar MFN, de från det andra hoppar över det (--utan-mfn).
    # Cision och Riksbanken hämtas vid båda.
    - cron: "17 */4 * * *"
    - cron: "17 2-23/4 * * *"
  workflow_dispatch:

permissions:
  contents: write # för att kunna pusha till det här (privata) repot

concurrency:
  group: raw-commit # samma grupp som "Hämta FI-register", så att två jobb inte pushar samtidigt
  cancel-in-progress: false

jobs:
  fetch:
    # Låst version i stället för ubuntu-latest, så att runner-byten (t.ex.
    # Ubuntu 26) sker när vi själva väljer det.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v7 av actions/checkout och actions/setup-python kör på Node 24 (kontrollerat 2026-10-05).
      - name: Checka ut rådatarepot
        uses: actions/checkout@v7
        with:
          path: raw

      - name: Checka ut koden från det publika repot
        uses: actions/checkout@v7
        with:
          repository: peternordengren-netizen/veckans-finans
          ref: main
          path: app
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # fetch.py använder bara standardbiblioteket (Linux har tidszonsdatabasen).
      - name: Hämta
        id: fetch
        run: |
          set +e
          # Schemat som utlöste körningen avgör, inte klockslaget: en försenad körning ska inte byta grupp.
          EXTRA=""
          if [ "${{ github.event.schedule }}" = "17 2-23/4 * * *" ]; then EXTRA="--utan-mfn"; fi
          echo "MFN: $([ -n "$EXTRA" ] && echo 'hoppas över' || echo 'hämtas') (schema: ${{ github.event.schedule || 'manuell' }})"
          python app/scripts/fetch.py --raw-dir raw $EXTRA
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Committa alltid, även när alla källor fallerat – då sparas åtminstone
      # felloggen i index.json → runs. Delvisa fel ger exit 0 och syns som
      # ::warning:: i loggen.
      - name: Committa ny rådata
        working-directory: raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -q -m "Hämtning $(date -u +%Y-%m-%dT%H:%MZ)"
            # Pushkonflikt (en säkerhetskopia, FI-jobbet eller kompletteringen från morgonflödet kan ha
            # pushat emellan): pull --rebase och nytt försök, högst tre gånger. En rebase som krockar
            # avbryts före nästa försök.
            for attempt in 1 2 3; do
              if git pull --rebase -q && git push -q; then
                echo "Pushad (försök $attempt)."
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" = 3 ]; then
                echo "::error::push misslyckades efter 3 försök (pull --rebase och push)."
                exit 1
              fi
              echo "::warning::push misslyckades (försök $attempt av 3) – nytt försök om $((attempt * 10)) s."
              sleep $((attempt * 10))
            done
          fi

      # Bara om ALLA källor fallerade (eller skriptet kraschade) blir körningen
      # röd, så att GitHub mejlar.
      - name: Rapportera att alla källor fallerade
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "::error::fetch.py avslutades med kod ${{ steps.fetch.outputs.code }} – inga källor kunde hämtas, se index.json → runs."
          exit 1
