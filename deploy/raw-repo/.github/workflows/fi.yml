# Mall för det PRIVATA repot veckans-finans-raw. Kopieras dit som
# .github/workflows/fi.yml – ligger här under deploy/ så att den aldrig körs
# i det publika repot.
#
# Hämtar Finansinspektionens blanknings- och insynsregister en gång per dygn
# med scripts/fi_fetch.py från det publika repot (tre anrop: blankning aggregat,
# blankning aktuella, insyn för gårdagen) och committar till det privata repot.
name: Hämta FI-register

on:
  schedule:
    # 04:37 UTC = 06:37 svensk sommartid (05:37 vintertid): gårdagens
    # rapporteringar är publicerade. Minut 37 för att undvika rusningen vid hel timme.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raw-commit # samma grupp som "Hämta råtext", så att två jobb inte pushar samtidigt
  cancel-in-progress: false

jobs:
  fi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Versioner kontrollerade 2026-10-05: alla kör på Node 24.
      - name: Checka ut rådatarepot
        uses: actions/checkout@v7
        with:
          path: raw

      - name: Checka ut koden från det publika repot
        uses: actions/checkout@v7
        with:
          repository: peternordengren-netizen/veckans-finans
          ref: main
          path: app
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # fi_fetch.py använder bara standardbiblioteket.
      - name: Hämta
        id: fetch
        run: |
          set +e
          python app/scripts/fi_fetch.py --raw-dir raw
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Committa
        working-directory: raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -q -m "FI-register $(date -u +%Y-%m-%dT%H:%MZ)"
            # Pushkonflikt (en säkerhetskopia, hämtningsjobbet eller kompletteringen från morgonflödet kan
            # ha pushat emellan): pull --rebase och nytt försök, högst tre gånger. En rebase som krockar
            # avbryts före nästa försök.
            for attempt in 1 2 3; do
              if git pull --rebase -q && git push -q; then
                echo "Pushad (försök $attempt)."
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" = 3 ]; then
                echo "::error::push misslyckades efter 3 försök (pull --rebase och push)."
                exit 1
              fi
              echo "::warning::push misslyckades (försök $attempt av 3) – nytt försök om $((attempt * 10)) s."
              sleep $((attempt * 10))
            done
          fi

      # Röd körning vid varje fel, också när bara en del misslyckades (kod 2): blankningen gav 404
      # från 29/10 2026 i flera dagar medan körningen var grön, eftersom insynen gick bra. Det som
      # hämtades har redan committats ovan.
      - name: Rapportera fel
        if: steps.fetch.outputs.code != '0'
        run: |
          if [ "${{ steps.fetch.outputs.code }}" = "2" ]; then
            echo "::error::fi_fetch.py: en del av FI-hämtningen misslyckades (se felen ovan); resten är committad."
          else
            echo "::error::fi_fetch.py avslutades med kod ${{ steps.fetch.outputs.code }} – inget kunde hämtas från FI."
          fi
          exit 1
